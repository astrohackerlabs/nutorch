# NuTorch's isolated Rust workspace; the archived v1 crate is not a member.
# Run Cargo from this directory so .cargo/config.toml is loaded. LibTorch
# 2.11.0 headers/libraries must be available through the local .libtorch path.
# Operator setup and publishing instructions live in Astrohacker's product docs.

[workspace]
members = ["shell", "core", "ops"]
exclude = ["forks/nushell", "forks/reedline"]
resolver = "2"

[workspace.package]
version = "2.0.1"
